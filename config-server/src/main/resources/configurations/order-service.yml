server:
  port: 9991

resilience4j:
  circuitbreaker:
    configs:
      # This creates a local 'template' for product-service
      order-service-defaults:
        baseConfig: global-shared-config # Inherit from the global application.yml
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        eventConsumerBufferSize: 10
    
    instances:
      orderitem-service-resilience:
        baseConfig: order-service-defaults # Inherit from the local template
        failureRateThreshold: 30
        
      order-service-resilience:
        baseConfig: order-service-defaults
        failureRateThreshold: 50
        
      payment-service-resilience:
        baseConfig: order-service-defaults
        failureRateThreshold: 60